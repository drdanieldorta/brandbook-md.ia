name: Publicar no GitHub Pages

# Publica o site do brandbook na raiz e o Storybook em /storybook/.
# Requer, uma vez, em Settings > Pages: Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORYBOOK_DISABLE_TELEMETRY: '1'
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ui
      - run: pnpm build:site
      - run: pnpm build:storybook
      - name: Montar artefato (site + storybook)
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r apps/brandbook/dist/. _site/
          mkdir -p _site/storybook
          cp -r packages/ui/storybook-static/. _site/storybook/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
